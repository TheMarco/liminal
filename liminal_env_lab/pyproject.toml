[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "liminal-environment-lab"
version = "0.1.0"
description = "Deterministic environmental augmentation asset pipeline for Godot 4"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10.4,<13",
  "scikit-image>=0.24,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=5,<8"]

[project.scripts]
liminal-lab = "liminal_lab.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/liminal_lab"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "liminal_lab/profiles"
"presets" = "liminal_lab/presets"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
