name: Procedural audits

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Godot audit suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.6.3

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Cache imported resources
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('models/**', 'textures/**', 'paintings/**', 'fonts/**', 'sounds/**', 'music/**') }}

      - name: Install official Godot build
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          install -m 0755 \
            "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Import project resources
        run: godot --headless --path . --editor --quit

      - name: Audit corridor topology
        run: godot --headless --path . --script tools/audit_corridors.gd

      - name: Audit Annex topology and minimalism
        run: godot --headless --path . --script tools/audit_annex.gd

      - name: Audit office and Annex wall utilities
        run: godot --headless --path . --script tools/audit_wall_utilities.gd

      - name: Audit semantic zones and landmarks
        run: godot --headless --path . --script tools/audit_zones.gd

      - name: Audit doorway furnishing clearance
        run: godot --headless --path . --script tools/audit_doorways.gd

      - name: Audit authored airport luggage
        run: godot --headless --path . --script tools/audit_airport_luggage.gd

      - name: Audit authored mall shopping carts
        run: godot --headless --path . --script tools/audit_mall_shopping_carts.gd

      - name: Audit mall directory orientation
        run: godot --headless --path . --script tools/audit_mall_directory.gd

      - name: Audit authored chemistry rooms and glassware
        run: godot --headless --path . --script tools/audit_chemistry_props.gd

      - name: Audit closed slot-machine cabinets
        run: godot --headless --path . --script tools/audit_slots.gd

      - name: Audit mall and prison furniture support
        run: godot --headless --path . --script tools/audit_new_levels.gd

      - name: Audit rule survivability
        run: godot --headless --path . --script tools/audit_survivability.gd

      - name: Audit interpenetrating floor furnishings
        run: godot --headless --path . --script tools/audit_prop_overlap.gd

      - name: Audit airport collision glass
        run: godot --headless --path . --script tools/audit_airport_colliders.gd

      - name: Audit mounted wall art
        run: godot --headless --path . --script tools/audit_wall_art.gd

      - name: Audit interactions
        run: godot --headless --path . --script tools/audit_interactions.gd

      - name: Audit portal and saved-position arrivals
        run: godot --headless --path . --script tools/audit_arrivals.gd

      - name: Audit runtime level switching
        run: godot --headless --path . --script tools/audit_level_switches.gd -- --nologo

      - name: Audit Descent objective routes
        run: godot --headless --path . --script tools/audit_descent_routes.gd -- 8

      - name: Audit blackout rewrites and mercy shortcuts
        run: godot --headless --path . --script tools/audit_blackout_shortcuts.gd -- 30

      - name: Audit Descent runtime contracts
        run: godot --headless --path . --script tools/audit_descent_runtime.gd -- --mode=descent --nologo

      - name: Audit blackout mutation reveal
        run: godot --headless --path . --script tools/audit_mutation_reveal.gd

      - name: Audit blackout light restoration
        run: godot --headless --path . --script tools/audit_blackout_lighting.gd

      - name: Audit reported airport runtime path
        run: godot --headless --path . --script tools/audit_airport_runtime.gd -- --mode=descent --descent-floor=4 --nologo

      - name: Audit persistent Descent checkpoint
        run: godot --headless --path . --script tools/audit_descent_progress.gd

      - name: Audit hostile figure contract
        run: godot --headless --path . --script tools/audit_ghost_room_contract.gd

      - name: Audit shared horror pacing director
        run: godot --headless --path . --script tools/audit_horror_director.gd

      - name: Audit title navigation and attribution
        run: godot --headless --path . --script tools/audit_title_screen.gd

      - name: Audit bundled fonts
        run: godot --headless --path . --script tools/font_check.gd

      # The Wander regression contract (docs/DESCENT.md) is the most emphasised
      # invariant in the project and was the only one with an audit that CI did
      # not run.
      - name: Audit Wander mode contract
        run: godot --headless --path . --script tools/audit_wander_mode.gd -- --nologo

      - name: Audit ceiling seams
        run: godot --headless --path . --script tools/audit_ceiling_seams.gd

      - name: Audit chunk construction smoke
        run: godot --headless --path . --script tools/audit_chunk_smoke.gd

      - name: Audit Pool Rooms corner geometry
        run: godot --headless --path . --script tools/audit_pool_corners.gd

      - name: Audit Pool Rooms scale
        run: godot --headless --path . --script tools/audit_pool_scale.gd

      - name: Build distributable resource pack
        run: godot --headless --quiet --path . --export-pack "macOS" "$RUNNER_TEMP/It wants you to stay-ci.pck"
