name: Procedural audits

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Godot audit suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GODOT_VERSION: 4.7.2

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Cache imported resources
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('models/**', 'textures/**', 'paintings/**', 'fonts/**', 'sounds/**', 'music/**') }}

      - name: Install official Godot build
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          install -m 0755 \
            "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Import project resources
        run: godot --headless --path . --editor --quit

      - name: Run authoritative audit suite
        run: tools/run_audits.sh -j 2 --no-import --log-dir "$RUNNER_TEMP/audit-logs"

      - name: Build distributable resource pack
        run: godot --headless --quiet --path . --export-pack "macOS" "$RUNNER_TEMP/It wants you to stay-ci.pck"

      - name: Verify exported pack resources
        run: |
          bash tools/verify_release_pack.sh "$RUNNER_TEMP/It wants you to stay-ci.pck" "$RUNNER_TEMP/audit-logs/pack-verify.log"

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-logs
          path: ${{ runner.temp }}/audit-logs
